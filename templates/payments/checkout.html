{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:480px;margin:0 auto;text-align:center;">
  <h2>Complete Payment</h2>
  <p>Order #{{ order.id }} — Total: <strong>₹{{ order.total_amount }}</strong></p>
  <button id="pay-btn" class="btn">Pay with Razorpay</button>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  document.getElementById("pay-btn").onclick = function () {
    var options = {
      "key": "{{ razorpay_key }}",
      "amount": "{{ amount_paise }}",
      "currency": "INR",
      "name": "FarmBridge AI",
      "description": "Order #{{ order.id }}",
      "order_id": "{{ razorpay_order_id }}",
      "handler": function (response) {
        // Send the payment details back to Django for SERVER-SIDE verification.
        var form = document.createElement("form");
        form.method = "POST";
        form.action = "{% url 'verify-payment' order.id %}";
        var csrf = document.createElement("input");
        csrf.type = "hidden"; csrf.name = "csrfmiddlewaretoken"; csrf.value = "{{ csrf_token }}";
        form.appendChild(csrf);
        ["razorpay_order_id", "razorpay_payment_id", "razorpay_signature"].forEach(function (key) {
          var input = document.createElement("input");
          input.type = "hidden"; input.name = key; input.value = response[key];
          form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();
      },
      "theme": { "color": "#2f6b3a" }
    };
    var rzp = new Razorpay(options);
    rzp.open();
  };
</script>
{% endblock %}
